name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Web build (TS + MDX)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          shellcheck --severity=error --external-sources
          scripts/deploy.sh
          scripts/00-preflight.sh
          scripts/45-openclaw.sh
          scripts/80-monitoring.sh
          scripts/fleet.sh
          scripts/lib/common.sh

  yaml-syntax:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import sys, glob, yaml
          files = sorted(set(
              glob.glob("manifests/**/*.yaml", recursive=True)
              + glob.glob("policies/**/*.yaml", recursive=True)
              + glob.glob("helm/**/*.yaml", recursive=True)
              + glob.glob("chart/values.yaml")
              + glob.glob("chart/charts/*/values.yaml")
          ))
          bad = 0
          for f in files:
              try:
                  list(yaml.safe_load_all(open(f)))
              except yaml.YAMLError as e:
                  print(f"✗ {f}: {e}"); bad += 1
          if bad:
              sys.exit(f"{bad} invalid YAML file(s)")
          print(f"✓ {len(files)} YAML files valid")
          PY

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint chart/
      - run: helm template nemoclaw chart/ --set global.clusterAppsDomain=apps.test.example.com

  docker-build:
    name: Docker build (workshop image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f web/Dockerfile --target builder .
