{{- if .Values.eventExporter.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-exporter-cfg
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    logLevel: error
    logFormat: json
    route:
      routes:
        - match:
            - receiver: loki
    receivers:
      - name: loki
        loki:
          url: {{ .Values.endpoints.loki.url }}{{ .Values.endpoints.loki.infrastructurePath }}/loki/api/v1/push
          streamLabels:
            job: kubernetes-event-exporter
          headers:
            Authorization: "${MONITORING_TOKEN}"
          tlsConfig:
            insecureSkipVerify: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-exporter
  namespace: {{ .Release.Namespace }}
  labels: { app: event-exporter }
spec:
  replicas: 1
  selector:
    matchLabels: { app: event-exporter }
  template:
    metadata:
      labels: { app: event-exporter }
    spec:
      serviceAccountName: monitoring-reader
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: event-exporter
          image: ghcr.io/resmoio/kubernetes-event-exporter:v1.7
          command: ["/bin/sh", "-c"]
          args:
            - |
              export MONITORING_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              exec /kubernetes-event-exporter -conf=/data/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - name: cfg
              mountPath: /data
      volumes:
        - name: cfg
          configMap: { name: event-exporter-cfg }
{{- end }}
