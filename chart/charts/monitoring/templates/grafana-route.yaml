{{- if .Values.grafanaRoute.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana
spec:
  {{- if .Values.global.clusterAppsDomain }}
  host: grafana-{{ .Release.Namespace }}.{{ .Values.global.clusterAppsDomain }}
  {{- end }}
  path: /grafana
  to:
    kind: Service
    name: kps-grafana
    weight: 100
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
