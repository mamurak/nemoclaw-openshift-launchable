{{- /*
SCC grants for the monitoring namespace — least-privilege per component.

Only node-exporter needs elevated access (hostPath + hostPort + hostPID).
All other components have their UIDs/GIDs nulled so OpenShift assigns from
the namespace range, letting them run under the default restricted SCC.
*/ -}}
{{- if (index .Values "kps" "nodeExporter" "enabled") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-scc-node-exporter
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["privileged"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-scc-node-exporter
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitoring-scc-node-exporter
subjects:
  - kind: ServiceAccount
    name: kps-prometheus-node-exporter
    namespace: {{ .Release.Namespace }}
{{- end }}
