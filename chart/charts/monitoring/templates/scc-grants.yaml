{{- /* SCC grant for the Grafana service account — needs nonroot to run as a specific UID. */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-scc-nonroot
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["nonroot"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-scc-nonroot
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitoring-scc-nonroot
subjects:
  - kind: ServiceAccount
    name: grafana
    namespace: {{ .Release.Namespace }}
