# Standalone Grafana (OpenShift does not include Grafana)
grafana:
  fullnameOverride: grafana
  # Grafana runs as UID 472 — needs nonroot-v2 SCC (granted in scc-grants.yaml).
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  initChownData:
    enabled: false
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/agent-fleet.json
  service:
    type: ClusterIP
  persistence:
    enabled: true
    type: pvc
    accessModes: ["ReadWriteOnce"]
    size: 2Gi
  sidecar:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      enabled: true
      label: grafana_datasource
      searchNamespace: ALL

# OpenShift monitoring endpoints
endpoints:
  prometheus:
    url: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
  loki:
    url: "https://logging-loki-gateway-http.openshift-logging.svc.cluster.local:8080"
    applicationPath: "/api/logs/v1/application"
    infrastructurePath: "/api/logs/v1/infrastructure"
  tempo:
    url: "https://tempo-tempostack-gateway.observability-hub.svc.cluster.local:8080"
    tenantPath: "/api/traces/v1/dev"

# Wrapper-level settings
grafanaRoute:
  enabled: true
eventExporter:
  enabled: true
