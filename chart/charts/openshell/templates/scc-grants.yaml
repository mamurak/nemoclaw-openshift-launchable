{{- /*
SCC grant for the OpenShell namespace. Sandbox pods need privileged because
the supervisor performs network namespace mounts (CAP_SYS_ADMIN + Unconfined
AppArmor). The gateway and other pods run under OpenShift's restricted SCC
(fsGroup/runAsUser are null so OpenShift assigns from the namespace range).
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openshell-scc-privileged
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["privileged"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshell-sandbox-privileged
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openshell-scc-privileged
subjects:
  - kind: ServiceAccount
    name: openshell-sandbox
    namespace: {{ .Release.Namespace }}
