apiVersion: v1
kind: Service
metadata:
  name: workshop
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: workshop
spec:
  selector:
    app.kubernetes.io/name: workshop
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: openclaw-ui
      port: 8789
      targetPort: openclaw-ui
