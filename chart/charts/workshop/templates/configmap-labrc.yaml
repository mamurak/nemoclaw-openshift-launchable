apiVersion: v1
kind: ConfigMap
metadata:
  name: workshop-labrc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: workshop
data:
  OPENCLAW_AGENT_NAME: {{ .Values.openclaw.agentName | quote }}
  OPENCLAW_GATEWAY_PASSWORD: {{ .Values.openclaw.gatewayPassword | quote }}
  OPENSHELL_GATEWAY_ENDPOINT_URL: {{ .Values.openshellGateway.endpointUrl | quote }}
