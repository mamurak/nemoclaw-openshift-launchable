# RustFS (S3-compatible) object storage for Tempo/Loki
# Always deploys to observability-hub namespace

storage:
  image: quay.io/rustfs/rustfs:1.0.4

  # Root credentials (admin access). Must match s3.accessKeyId / s3.accessKeySecret
  # in deploy/observability/tempo/values.yaml and deploy/observability/loki/values.yaml.
  # RustFS requires the secret key to be at least 8 characters.
  secret:
    user: admin
    password: observability123

  # Service configuration
  service:
    enabled: true
    type: ClusterIP
    port: 9001
    apiPort: 9000

  # Bucket configuration - array of bucket names
  buckets: ["tempo", "loki"]

  # Image used by the bucket-init Job
  bucketInitImage: docker.io/amazon/aws-cli:2.39.3

  # Persistent volume configuration
  persistence:
    size: 5Gi
    # Optional: bind PVC to a named StorageClass (e.g. gp3). If unset, the
    # cluster default StorageClass is used — required on clouds where no default exists.
    # storageClassName: gp3

  # RustFS buffers Loki/Tempo chunk uploads in memory; at 512Mi it is OOMKilled
  # as soon as the Loki ingester starts flushing, which hangs all Loki queries.
  # Memory request == limit so the pod is not an early eviction candidate (Loki
  # and Tempo stall without it). No CPU limit, to avoid throttling during flushes.
  resources:
    requests:
      memory: 2Gi
      cpu: 250m
    limits:
      memory: 2Gi

  # Security Context - empty to let OpenShift assign UID/fsGroup
  podSecurityContext: {}
