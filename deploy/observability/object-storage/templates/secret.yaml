{{- $namespace := include "object-storage.namespace" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "object-storage.fullname" . }}
  namespace: {{ $namespace }}
  labels:
    {{- include "object-storage.labels" . | nindent 4 }}
type: Opaque
stringData:
  RUSTFS_ACCESS_KEY: {{ .Values.storage.secret.user | quote }}
  RUSTFS_SECRET_KEY: {{ .Values.storage.secret.password | quote }}
