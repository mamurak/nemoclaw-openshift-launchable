{{/*
MinIO Deployment - Deployed to observability-hub namespace
*/}}
{{- $namespace := include "minio.namespace" . }}
{{- $deploymentName := include "minio.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $deploymentName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "minio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minio.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.minio.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: minio
        image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
        args:
        - server
        - /data
        - --console-address
        - ":9090"
        ports:
        - name: api
          containerPort: 9000
          protocol: TCP
        - name: webui
          containerPort: 9090
          protocol: TCP
        envFrom:
        - secretRef:
            name: {{ include "minio.fullname" . }}
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: api
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: api
          initialDelaySeconds: 5
          periodSeconds: 15
        {{- with .Values.minio.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "minio.fullname" . }}-data
